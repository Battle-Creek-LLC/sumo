[package]
name = "bcl-sumo"
version = "0.1.3"
edition = "2021"
description = "A fast, minimal CLI for querying Sumo Logic logs"
license = "MIT"
repository = "https://github.com/Battle-Creek-LLC/sumo"
readme = "README.md"
keywords = ["sumo-logic", "logs", "cli", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "sumo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "sync-secret-service"] }
dialoguer = "0.11"
ctrlc = "3"
comfy-table = "7"
csv = "1"
