[package]
name = "sumo"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal CLI for querying Sumo Logic logs"
license = "MIT"
repository = "https://github.com/jstockdi/sumo"
readme = "README.md"
keywords = ["sumo-logic", "logs", "cli", "search"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
security-framework = "2"
dialoguer = "0.11"
ctrlc = "3"
comfy-table = "7"
csv = "1"
