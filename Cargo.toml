[package]
name = "bcl-sumo"
version = "0.1.4"
edition = "2021"
description = "A fast, minimal CLI for querying Sumo Logic logs"
license = "MIT"
repository = "https://github.com/Battle-Creek-LLC/sumo"
readme = "README.md"
keywords = ["sumo-logic", "logs", "cli", "search"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sumo-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "sumo{ binary-ext }"

[[bin]]
name = "sumo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
directories = "5"
dialoguer = "0.11"
ctrlc = "3"
comfy-table = "7"
csv = "1"
